static_resources:
  listeners:
    - name: forward_proxy_listener
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: envoy_forward_proxy
                codec_type: AUTO
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 10.0.0.0
                      prefix_len: 8
                    - address_prefix: 172.16.0.0
                      prefix_len: 12
                    - address_prefix: 192.168.0.0
                      prefix_len: 16
                upgrade_configs:
                  - upgrade_type: CONNECT
                route_config:
                  name: forward_proxy_routes
                  virtual_hosts:
                    - name: forward_proxy_vhost
                      domains: ["*"]
                      routes:
                        - match:
                            path: "/healthz"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "ok\n"
                        - match:
                            connect_matcher: {}
                          route:
                            cluster: dynamic_forward_proxy_http
                            timeout: 0s
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-envoy-target-scheme
                                string_match:
                                  exact: "https"
                          route:
                            cluster: dynamic_forward_proxy_https
                            timeout: 60s
                          request_headers_to_remove:
                            - x-envoy-target-scheme
                            - x-target-host
                            - x-target-scheme
                        - match:
                            prefix: "/"
                          route:
                            cluster: dynamic_forward_proxy_http
                            timeout: 60s
                          request_headers_to_remove:
                            - x-envoy-target-scheme
                            - x-target-host
                            - x-target-scheme
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(request_handle)
                            local headers = request_handle:headers()
                            local path = headers:get(":path") or ""
                            local method = headers:get(":method") or ""
                            if path == "/healthz" or method == "CONNECT" then
                              return
                            end

                            if headers:get("x-envoy-forward-hop") then
                              request_handle:respond(
                                {[":status"] = "400", ["content-type"] = "text/plain"},
                                "Loop detected: set X-Target-Host to your destination VPC backend\n"
                              )
                              return
                            end
                            headers:add("x-envoy-forward-hop", "1")

                            local target = headers:get("x-target-host")
                            local scheme = headers:get("x-target-scheme")

                            if not target or target == "" then
                              local xfh = headers:get("x-forwarded-host")
                              if xfh and xfh ~= "" and not xfh:match("%.run%.app$") then
                                target = xfh
                              end
                            end

                            if not target or target == "" then
                              local auth = headers:get(":authority") or ""
                              if auth == "" or auth:match("%.run%.app$") then
                                request_handle:respond(
                                  {[":status"] = "400", ["content-type"] = "text/plain"},
                                  "Missing X-Target-Host header\n"
                                )
                                return
                              end
                              target = auth
                            end

                            local parsed_scheme, rest = target:match("^(https?)://(.+)$")
                            if parsed_scheme then
                              scheme = parsed_scheme
                              target = rest
                            end
                            target = target:gsub("/.*$", "")

                            scheme = string.lower(scheme or "")
                            if scheme == "" then
                              if target:match(":443$") then
                                scheme = "https"
                              else
                                scheme = "http"
                              end
                            end

                            headers:replace(":authority", target)
                            headers:replace("x-envoy-target-scheme", scheme)
                          end
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config:
                        name: dynamic_forward_proxy_cache_config
                        dns_lookup_family: V4_ONLY
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: dynamic_forward_proxy_http
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config:
            name: dynamic_forward_proxy_cache_config
            dns_lookup_family: V4_ONLY

    - name: dynamic_forward_proxy_https
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          allow_insecure_cluster_options: true
          dns_cache_config:
            name: dynamic_forward_proxy_cache_config
            dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          upstream_http_protocol_options:
            auto_sni: true
            auto_san_validation: false
          explicit_http_config:
            http_protocol_options: {}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context: {}
